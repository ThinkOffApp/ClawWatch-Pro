[versions]
agp = "9.3.1"
coreKtx = "1.13.1"
wear = "1.3.0"
wearInput = "1.1.0"
activity = "1.9.0"
coroutines = "1.8.1"
vosk = "0.3.47"
securityCrypto = "1.1.0-alpha06"
googlePlayServicesAuth = "21.3.0"
wearable = "18.1.0"
workRuntime = "2.9.0"
coroutinesPlayServices = "1.8.1"
firebaseMessaging = "24.1.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
wear = { group = "androidx.wear", name = "wear", version.ref = "wear" }
wear-input = { group = "androidx.wear", name = "wear-input", version.ref = "wearInput" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
vosk-android = { group = "com.alphacephei", name = "vosk-android", version.ref = "vosk" }
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
google-play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "googlePlayServicesAuth" }
play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "wearable" }
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workRuntime" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutinesPlayServices" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging", version.ref = "firebaseMessaging" }

[plugins]
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version = "2.2.20" }
android-application = { id = "com.android.application", version.ref = "agp" }
