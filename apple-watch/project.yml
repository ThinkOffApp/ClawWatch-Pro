name: ClawWatchApple
options:
  bundleIdPrefix: com.thinkoff
  deploymentTarget:
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    PRODUCT_NAME: ClawWatch
    GENERATE_INFOPLIST_FILE: NO
targets:
  ClawWatchApple:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ClawWatchApple/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thinkoff.clawwatch.applewatch
        INFOPLIST_FILE: ClawWatchApple/Info.plist
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
